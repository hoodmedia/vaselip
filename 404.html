<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Loading Video...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .box {
            animation: fade 1s ease-in-out infinite alternate;
        }

        @keyframes fade {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Loading video...</h2>
    <p>Please wait a moment</p>
</div>

<script>
    // Ambil path URL (contoh: /FlJDn)
    let path = window.location.pathname;

    // Bersihkan "/" di depan
    let id = path.replace("/", "");

    // Validasi ID
    if (!id || id.length < 3) {
        document.body.innerHTML = "<h2>Invalid Link</h2>";
    } else {

        // Target redirect
        let target = "https://good.doodplay.com/" + id;

        // Delay (opsional, bisa diubah)
        setTimeout(() => {
            window.location.href = target;
        }, 2000);
    }
</script>

</body>
</html>
