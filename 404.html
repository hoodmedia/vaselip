<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pilih Video</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .box {
            max-width: 400px;
        }

        .btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn1 { background: #3b82f6; }
        .btn2 { background: #22c55e; }

        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎬 Pilih Video</h2>
    <p>Klik salah satu link di bawah</p>

    <button class="btn btn1" id="video1">▶️ Video Link 1</button>
    <button class="btn btn2" id="video2">🎲 Video Random</button>

    <p id="info"></p>
</div>

<script>
    let path = window.location.pathname;

    // Ambil ID dari URL (contoh: /vaselip/FlJDn)
    let parts = path.split("/").filter(Boolean);
    let mainID = parts[parts.length - 1];

    // 🔥 LIST ID RANDOM (EDIT DI SINI)
    let randomIDs = [
        "FlJDn",
        "tStVX",
        "rtDNA",
        "luPTE",
        "ZawuZ",
        "HkzRs",
        "FTQle",
        "iXkFb"
    ];

    // Fungsi ambil random
    function getRandomID() {
        return randomIDs[Math.floor(Math.random() * randomIDs.length)];
    }

    // Tombol 1 → pakai ID dari URL
    document.getElementById("video1").onclick = function() {
        if (mainID && mainID.length > 3) {
            window.location.href = "https://good.doodplay.com/" + mainID;
        }
    };

    // Tombol 2 → random rotator
    document.getElementById("video2").onclick = function() {
        let randomID = getRandomID();
        window.location.href = "https://good.doodplay.com/" + randomID;
    };
</script>

</body>
</html>
