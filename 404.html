<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Select Video</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .box {
            max-width: 400px;
        }

        .btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn1 { background: #3b82f6; }
        .btn2 { background: #22c55e; }

        .btn:hover { opacity: 0.85; }

        #loading {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🎬 Select Video</h2>
    <p>Click one of the buttons below 👇</p>

    <button class="btn btn1" id="video1" disabled>▶️ Video Link 1</button>
    <button class="btn btn2" id="video2" disabled>🎲 Video Random</button>

    <p id="loading">Loading data...</p>
</div>

<script>
    let path = window.location.pathname;
    let parts = path.split("/").filter(Boolean);
    let mainID = parts[parts.length - 1];

    let allIDs = [];

    // Ambil list dari ids.txt
    fetch("ids.txt")
        .then(res => res.text())
        .then(data => {
            allIDs = data.split("\n")
                .map(id => id.trim())
                .filter(id => id.length > 3);

            document.getElementById("loading").innerText = "Enjoy Wathing ✅";

            initButtons();
        })
        .catch(err => {
            document.getElementById("loading").innerText = "Gagal load data!";
        });

    function getRandomID() {
        return allIDs[Math.floor(Math.random() * allIDs.length)];
    }

    function initButtons() {

        let btn1 = document.getElementById("video1");
        let btn2 = document.getElementById("video2");

        btn1.disabled = false;
        btn2.disabled = false;

        // Tombol 1 → ID dari URL
        btn1.onclick = function() {
            if (mainID && mainID.length > 3) {
                window.location.href = "https://good.doodplay.com/" + mainID;
            }
        };

        // Tombol 2 → random dari ids.txt
        btn2.onclick = function() {
            let randomID = getRandomID();
            window.location.href = "https://good.doodplay.com/" + randomID;
        };
    }
</script>

</body>
</html>
