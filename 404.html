<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Loading Video...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>

<div>
    <h2>Loading video...</h2>
    <p>Please wait...</p>
</div>

<script>
    let path = window.location.pathname;

    // Hapus nama repo (vaselip)
    let repo = "/vaselip/";
    let id = path.replace(repo, "");

    // Validasi
    if (!id || id.includes("/")) {
        document.body.innerHTML = "<h2>Invalid Link</h2>";
    } else {
        let target = "https://good.doodplay.com/" + id;

        setTimeout(() => {
            window.location.href = target;
        }, 1500);
    }
</script>

</body>
</html>
